[package]
name = "tls-example"
version = "0.1.0"
edition = "2024"
publish = false

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[[bin]]
name = "tls_example"
path = "src/main.rs"

[dependencies]
# ZZNet components
zznet-api = { path = "../../src/common/zznet-api" }
zznet-hello = { path = "../../src/actors/zznet-hello" }
zznet-builder = { path = "../../src/components/zznet-builder" }
zznet-session = { path = "../../src/components/zznet-session" }
zznet-transport-tcp = { path = "../../src/transports/zznet-transport-tcp" }

# Async runtime
actix = { workspace = true }
tokio = { workspace = true }

# Auth crate for examples
zzping-auth = { path = "../../src/common/zzping-auth" }

# Serialization
bincode = { workspace = true }
serde = { workspace = true }

# Logging
env_logger = { workspace = true }
log = { workspace = true }
