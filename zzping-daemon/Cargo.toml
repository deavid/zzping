[package]
name = "zzping-daemon"
version = "0.2.2-beta2"
authors = ["Google LLC", "David Martinez Marti <deavidsedice@gmail.com>"]
edition = "2021"

[dependencies]
zzping-lib = { path = "../zzping-lib" }
env_logger = "0.11"
log = "0.4"
pnet = "0.35"
pnet_transport = "0.35"
pnet_macros_support = "0.35"
rand = "0.9"
rmp = "0.8"
ron = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
tempfile = "3.21"
anyhow = "1.0"
