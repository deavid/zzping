[package]
name = "zznet-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ZZPing Network Layer: Transport abstraction traits and mock implementation"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# Keep legacy for compatibility during migration
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "sync"] }
