[package]
name = "zznet-room"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ZZPing Network Layer PoC #1: Room-to-Room typed communication"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
actix.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
bincode.workspace = true

# Internal dependencies - NO zznet-session to avoid cycles
zznet-api = { path = "../zznet-api" }
zznet-auth = { path = "../zznet-auth" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
