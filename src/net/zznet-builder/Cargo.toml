[package]
name = "zznet-builder"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level builder API for ZZPing network servers and clients"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
zznet-api = { path = "../zznet-api" }
zznet-hello = { path = "../zznet-hello" }
zznet-session = { path = "../zznet-session" }
zznet-transport-tcp = { path = "../zznet-transport-tcp" }
actix.workspace = true
tokio.workspace = true
tracing = "0.1"
thiserror.workspace = true
zznet-auth = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde = { workspace = true }
bincode = { workspace = true }
