[package]
name = "zznet-transport-tcp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TCP/TLS transport implementation for ZZPing network stack"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
# Internal dependencies
zznet-api = { path = "../zznet-api" }

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# TLS
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rustls-native-certs.workspace = true

# Certificate parsing
x509-parser = "0.18"

# Data handling
bytes.workspace = true
byteorder.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Serialization (for frame length prefix)
bincode.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = [
    "test-util",
    "macros",
    "rt-multi-thread",
] }
tempfile.workspace = true
rcgen = "0.14"
