[package]
name = "zzping-old-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A command-line tool for inspecting zzping data files."

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
zzping-lib = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true
log.workspace = true
chrono = { version = "0.4", features = ["serde"] }
env_logger.workspace = true
