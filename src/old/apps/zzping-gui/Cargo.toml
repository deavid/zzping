[package]
name = "zzping-old-gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An egui-based GUI for viewing live and historical zzping data"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
# NOTE: All crates must define their dependencies in the workspace Cargo.toml for centralization
# ...   and instead use "cratename.workspace = true" to refer to it.
zzping-lib = { workspace = true }
zzping-proto = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
tonic = { workspace = true }
crossbeam-channel.workspace = true
log.workspace = true
serde_json.workspace = true
anyhow.workspace = true
byteorder.workspace = true
chrono.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true

[dev-dependencies]
tokio-stream = { workspace = true }
env_logger = { workspace = true }
ntest = { workspace = true }
zzping-old-database = { path = "../zzping-database", features = ["test-utils"] }
