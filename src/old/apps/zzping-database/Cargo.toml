[package]
name = "zzping-old-database"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Database service for zzping"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
# NOTE: All crates must define their dependencies in the workspace Cargo.toml for centralization
# ...   and instead use "cratename.workspace = true" to refer to it.
zzping-lib = { workspace = true }
zzping-proto = { workspace = true }
anyhow.workspace = true
base64.workspace = true
bitflags.workspace = true
dashmap = { workspace = true }
futures-core = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
byteorder.workspace = true
bytes.workspace = true
chrono.workspace = true
constriction.workspace = true
crc32fast.workspace = true
env_logger.workspace = true
log.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "net",
    "rt-multi-thread",
    "macros",
    "io-util",
    "sync",
    "time",
] }
ntest = { workspace = true }

[features]
test-utils = []

[dev-dependencies]
tempfile.workspace = true
zzping-old-database = { path = ".", features = ["test-utils"] }
