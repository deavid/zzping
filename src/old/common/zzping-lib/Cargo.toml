[package]
name = "zzping-lib"
version.workspace = true
authors.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Shared library for zzping services"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
# NOTE: All crates must define their dependencies in the workspace Cargo.toml for centralization
# ...   and instead use "cratename.workspace = true" to refer to it.
anyhow.workspace = true
bincode.workspace = true
bitflags.workspace = true
byteorder.workspace = true
constriction.workspace = true
crc32fast.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
log.workspace = true
crossbeam-channel = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
surge-ping = { workspace = true, optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "chunked_v1_benches"
harness = false
