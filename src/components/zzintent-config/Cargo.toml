[package]
name = "zzintent-config"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
actix = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
env_logger = { workspace = true }
ntest = { workspace = true }
tokio-stream = { workspace = true }
ron = "0.11"
bincode = { version = "2.0", features = ["serde"] }
zznet-session = { path = "../../net/zznet-session" }
zznet-auth = { workspace = true }
zznet-hello = { path = "../../net/zznet-hello" }

[dev-dependencies]
tempfile = "3.23"
zznet-room = { path = "../../net/zznet-room" }
