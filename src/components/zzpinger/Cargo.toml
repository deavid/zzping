[package]
name = "zzpinger"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13"
tokio = { version = "1.0", features = ["full", "time"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"

# For ICMP ping
surge-ping = "0.8"

# Our components
zzmem-db = { path = "../zzmem-db" }

futures = "0.3"

[dev-dependencies]
ntest = "0.9"
tokio-test = "0.4"
