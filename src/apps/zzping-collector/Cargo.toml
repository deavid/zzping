[package]
name = "zzping-collector"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zzping-collector"
path = "src/main.rs"

[dependencies]
zzintent-config.workspace = true
zzpinger.workspace = true
zzmem-db.workspace = true
zzcollector-state.workspace = true

# Common dependencies
zzping-auth.workspace = true

# Network layer dependencies
zznet-peer-manager.workspace = true # Peer state management
zznet-router.workspace = true       # Message routing
# zznet-builder.workspace = true  # DEPRECATED - Phase 3 migration to zznet-room
zznet-room.workspace = true          # Vision-aligned Room<T> pattern
zznet-transport-tcp.workspace = true
zznet-auth.workspace = true
zznet-api.workspace = true
zznet-hello.workspace = true

# Runtime dependencies
tokio.workspace = true
actix.workspace = true
actix-rt = "2"
bincode.workspace = true
log.workspace = true

# Configuration and serialization
serde.workspace = true
ron.workspace = true

# CLI argument parsing
clap.workspace = true

# Logging and tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true
async-trait = "0.1"

# TLS/crypto
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true

# Utilities
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true
