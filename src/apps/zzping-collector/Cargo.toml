[package]
name = "zzping-collector"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Collector service for zzping"

# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[lints]
# This makes the crate inherit all lints defined in [workspace.lints]
workspace = true

[dependencies]
zzping-lib = { workspace = true }
zzping-proto = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bincode.workspace = true
bytes.workspace = true
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
env_logger.workspace = true
log.workspace = true
rand.workspace = true
ron = { workspace = true }
serde.workspace = true
serde_json.workspace = true
surge-ping.workspace = true
tokio = { workspace = true, features = [
    "net",
    "rt-multi-thread",
    "macros",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
byteorder = "1.5"
tempfile = "3.23"
toml = "0.9"
zzping-database = { workspace = true, features = ["test-utils"] }
mockall = "0.13"
ntest = "0.9"
serial_test = "3.2"
