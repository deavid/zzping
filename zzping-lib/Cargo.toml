[package]
name = "zzping-lib"
version = "0.2.2-beta2"
authors = ["Google LLC", "David Martinez Marti <deavidsedice@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rmp = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
rustfft = "6.4"
bit-vec = "0.6"                                   # for huffman, also for serializing
huffman-compress = "0.6"
anyhow = "1.0"
thiserror = "2.0"
probability = "0.20"
rustdct = "0.7"
log = "0.4"
rand = "0.9"
env_logger = "0.11"
lazy_static = "1.5"
