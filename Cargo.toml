[workspace]
resolver = "2"
members = [
    # "src/old/common/zzping-lib",
    # "src/old/common/zzping-proto",
    # "src/old/apps/zzping-cli",
    # "src/old/apps/zzping-gui",

    "src/net/zznet-api",
    "src/net/zznet-component",
    "src/net/zznet-hello",
    "src/net/zznet-room",
    "src/net/zznet-router",
    "src/net/zznet-transport-tcp",

    "src/components/zzintent-config",
    "src/components/zzmem-db",
    "src/components/zzpinger",
    "src/components/zzcollector-state",

    "src/apps/zzping-collector",
    "src/apps/zzping-database",
    "src/apps/zzping-integration-test",
    "src/apps/zznet-demo", "src/components/zzstorage",

]

[workspace.package]
version = "0.3.0-dev"
authors = ["Google LLC", "David Martinez Marti <deavidsedice@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/deavid/zzping"
description = "Tools to monitor home network latency and packet loss"

[workspace.dependencies]
# NOTE: All crates must define their dependencies in the workspace Cargo.toml for centralization
# ...   and instead use "cratename.workspace = true" to refer to it.

# Internal dependencies
zznet-api = { path = "src/net/zznet-api" }
zznet-component = { path = "src/net/zznet-component" }
zznet-hello = { path = "src/net/zznet-hello" }
zznet-room = { path = "src/net/zznet-room" }
zznet-router = { path = "src/net/zznet-router" }
zznet-transport-tcp = { path = "src/net/zznet-transport-tcp" }

zzintent-config = { path = "src/components/zzintent-config" }
zzpinger = { path = "src/components/zzpinger" }
zzmem-db = { path = "src/components/zzmem-db" }
zzcollector-state = { path = "src/components/zzcollector-state" }

# External dependencies
anyhow = "1.0"
base64 = "0.22"
dashmap = "6.1.0"
futures-core = "0.3"
prost = "0.14"


tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
async-std = { version = "1.13", features = ["unstable"] }
async-trait = "0.1"
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.33"
egui = "0.33"
env_logger = "0.11"
lazy_static = "1.5"
log = "0.4"
ping-rs = "0.1.2"
pnet = "0.35"
pnet_transport = "0.35"
pnet_macros_support = "0.35"
probability = "0.20"
rand = "0.9"
rmp = "0.8"
ron = "0.11"
rustdct = "0.7"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
surge-ping = "0.8"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1", features = [
    "full",
    "macros",
    "rt-multi-thread",
    "rt",
    "signal",
    "test-util",
] }
tonic-health = "0.14"
toml = "0.9"
tracing = "0.1"
futures = "0.3" # Moved back to [workspace.dependencies]
mockall = "0.13"
ntest = "0.9"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
rmp-serde = "1.3"
actix = "0.13"
actix-rt = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }

# Additional external dependencies
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-test = "0.4"


# Dependencies for specific crates that haven't been centralized yet
rerun = "0.26"
constriction = "0.4"
bitflags = "2.9"
crc32fast = "1.5"
crossbeam-channel = "0.5"
bytes = "1"
serde_json = "1.0"
x509-parser = "0.18"
rcgen = "0.14"
criterion = "0.7"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 2


# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[workspace.lints.rust]
dead_code = "warn"
unused_variables = "warn"
missing_docs = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
new_ret_no_self = "warn"
wildcard_imports = "warn"
let_unit_value = "warn"
uninlined_format_args = "allow"
type_complexity = "allow"
