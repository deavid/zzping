[workspace]
resolver = "2"
members = [
    "src/common/zzping-lib",
    "src/common/zzping-proto",
    "src/common/zznet-api",
    "src/common/zzping-auth",
    "src/apps/zzping-database",
    "src/apps/zzping-collector",
    "src/apps/zzping-cli",
    "src/apps/zzping-gui",
    "src/actors/zzintent-config",
    "src/actors/zznet-hello",
    "src/components/zznet-builder",
    "src/components/zznet-room",
    "src/components/zznet-session",
    "src/transports/zznet-transport-tcp",
    "examples/simple-network-example",
    "examples/message-exchange-example",
    "examples/tls-example",
]

[workspace.package]
version = "0.2.2-beta2"
authors = ["Google LLC", "David Martinez Marti <deavidsedice@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/deavid/zzping"
description = "Tools to monitor home network latency and packet loss"

[workspace.dependencies]
# NOTE: All crates must define their dependencies in the workspace Cargo.toml for centralization
# ...   and instead use "cratename.workspace = true" to refer to it.

# Internal dependencies
zzping-lib = { path = "src/common/zzping-lib" }
zzping-proto = { path = "src/common/zzping-proto" }
zzping-auth = { path = "src/common/zzping-auth" }
zzping-database = { path = "src/apps/zzping-database" }

# External dependencies
anyhow = "1.0"
base64 = "0.22"
dashmap = "5.5.3"
futures-core = "0.3"
prost = "0.12"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
tonic-build = "0.11"
async-std = { version = "1.13", features = ["unstable"] }
async-trait = "0.1"
bincode = "1.3"
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.32"
egui = "0.32"
env_logger = "0.11"
lazy_static = "1.5"
log = "0.4"
ping-rs = "0.1.2"
pnet = "0.35"
pnet_transport = "0.35"
pnet_macros_support = "0.35"
probability = "0.20"
rand = "0.9"
rmp = "0.8"
ron = "0.11"
rustdct = "0.7"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
surge-ping = "0.8"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1", features = ["full", "test-util"] }
tonic-health = "0.7"
toml = "0.8"
tracing = "0.1"
futures = "0.3"                                               # Moved back to [workspace.dependencies]
mockall = "0.12"
ntest = "0.9"
rustls = "0.23.32"
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
rmp-serde = "1.3"
actix = "0.13"

# Dependencies for specific crates that haven't been centralized yet
rerun = "0.24"
constriction = "0.4"
bitflags = "2.9"
crc32fast = "1.5"
crossbeam-channel = "0.5"
bytes = "1"
serde_json = "1.0"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 2
