[workspace]
resolver = "2"
members = [
    "src/old/common/zzping-lib",
    "src/old/common/zzping-proto",
    "src/net/zznet-api",
    "src/net/zznet-auth",
    "src/old/apps/zzping-cli",
    "src/old/apps/zzping-gui",
    "src/components/zzintent-config",
    "src/components/zzmem-db",
    "src/components/zzpinger",
    "src/components/zzcollector-state",
    "src/test-utils/zzping-test-utils",
    "src/net/zznet-hello",
    "src/net/zznet-builder",
    "src/net/zznet-room",
    "src/net/zznet-session",
    "src/net/zznet-transport-tcp",
    "src/apps/zzping-collector",
    "examples/simple-network-example",
    "examples/message-exchange-example",
    "examples/tls-example",
    "src/apps/zzping-database",
]

[workspace.package]
version = "0.2.2-beta2"
authors = ["Google LLC", "David Martinez Marti <deavidsedice@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/deavid/zzping"
description = "Tools to monitor home network latency and packet loss"

[workspace.dependencies]
# NOTE: All crates must define their dependencies in the workspace Cargo.toml for centralization
# ...   and instead use "cratename.workspace = true" to refer to it.

# Internal dependencies
zzping-lib = { path = "src/old/common/zzping-lib" }
zzping-proto = { path = "src/old/common/zzping-proto" }
zznet-auth = { path = "src/net/zznet-auth" }
zzping-test-utils = { path = "src/test-utils/zzping-test-utils" }

# External dependencies
anyhow = "1.0"
base64 = "0.22"
dashmap = "6.1.0"
futures-core = "0.3"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-build = "0.14"
tonic-prost-build = "0.14"
async-std = { version = "1.13", features = ["unstable"] }
async-trait = "0.1"
bincode = { version = "2.0", features = ["serde"] }
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.32"
egui = "0.32"
env_logger = "0.11"
lazy_static = "1.5"
log = "0.4"
ping-rs = "0.1.2"
pnet = "0.35"
pnet_transport = "0.35"
pnet_macros_support = "0.35"
probability = "0.20"
rand = "0.9"
rmp = "0.8"
ron = "0.11"
rustdct = "0.7"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
surge-ping = "0.8"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1", features = ["full", "test-util"] }
tonic-health = "0.14"
toml = "0.9"
tracing = "0.1"
futures = "0.3"                                                           # Moved back to [workspace.dependencies]
mockall = "0.13"
ntest = "0.9"
rustls = { version = "0.23.32", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
rmp-serde = "1.3"
actix = "0.13"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Dependencies for specific crates that haven't been centralized yet
rerun = "0.25"
constriction = "0.4"
bitflags = "2.9"
crc32fast = "1.5"
crossbeam-channel = "0.5"
bytes = "1"
serde_json = "1.0"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 2


# Workspace-wide linting: Since collaborators here (read, AI agents) are too happy to just allow a lint and move on, we
# are adding here a workspace wide forbid on the lints that must not be overriden. Do not be even tempted to change this!
# If you think you have a legitimate reason for one of these, think again: YOU DON'T. DO NOT TOUCH THESE LINT CONFIGS!
[workspace.lints.rust]
dead_code = "deny"
unused_variables = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
new_ret_no_self = "deny"
wildcard_imports = "deny"
let_unit_value = "deny"
uninlined_format_args = "allow"
