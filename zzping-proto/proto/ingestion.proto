// File: zzping-proto/proto/ingestion.proto

syntax = "proto3";

package zzping; // The Rust code will be generated inside a `zzping` module.

// The main service that the zzping-database will expose.
service Ingestion {
  // Collector calls this periodically for liveness and config.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Collector calls this to send batches of ping data.
  rpc SendBatch(SendBatchRequest) returns (SendBatchResponse);

  // GUI/CLI calls this to get recent data for a handoff.
  rpc GetRecentData(GetRecentDataRequest) returns (GetRecentDataResponse);

  // GUI/CLI calls this for historical data.
  rpc QueryData(QueryRequest) returns (QueryResponse);

  // Collector calls this to announce pings for real-time visualization.
  rpc AnnouncePings(AnnouncePingsRequest) returns (AnnouncePingsResponse);

  // Collector subscribes to this stream for low-latency commands from the database.
  rpc SubscribeToCommands(CommandRequest) returns (stream Command);
}

// --- Enums ---
enum CollectorRole {
  // The collector is the designated primary and should be actively pinging.
  PRIMARY = 0;
  // The collector is a hot-standby, ready to take over but should not be pinging.
  STANDBY = 1;
  // The collector is supervising a new primary during a handoff trial period. It should not ping.
  SUPERVISING = 2;
  // The collector has been successfully replaced and should shut down.
  SHUTDOWN = 3;
  // The collector is a new instance starting up during a handoff, actively pinging
  // but not yet sending data.
  PRIMARY_SUPERVISED = 4;
}

// --- Message Definitions for Heartbeat ---
message HeartbeatRequest {
  string collector_uuid = 1;
  // The process ID of the collector instance.
  uint64 pid = 2;
  // The collector's current operational role.
  CollectorRole current_role = 3;
  // The current total size of the collector's in-memory data buffer.
  uint64 buffer_record_count = 4;
  // A message for any persistent, unrecoverable error.
  string last_fatal_error = 5;
  // The ID of the last command processed from the command stream.
  uint64 last_processed_command_id = 6;
}
message HeartbeatResponse {
  repeated string targets = 1;
  uint64 ping_rate_pps = 2;
  // The role assigned to the collector by the database scheduler.
  CollectorRole role = 3;
  // If a swap is scheduled, this is the UTC nanosecond timestamp for the swap to occur.
  uint64 swap_at_nanos = 4;
}

// --- Message Definitions for SendBatch ---
message SendBatchRequest {
  string collector_uuid = 1;
  string target_ip = 2;
  repeated RawDataRecord records = 3;
  uint64 collector_believes_last_acked_received_nanos = 4;
}
message SendBatchResponse {
  enum Status {
    OK = 0;
    DESYNC = 1;
  }
  Status status = 1;
  uint64 database_confirms_last_acked_received_nanos = 2;
}

// --- Message Definitions for GetRecentData ---
message GetRecentDataRequest {
  string collector_uuid = 1;

  // The duration of recent history to fetch, in seconds.
  // e.g., 3600 for the last hour.
  uint32 lookback_seconds = 2;
}

message GetRecentDataResponse {
  // The requested historical records. The database will return
  // records for all targets associated with the collector_uuid.
  repeated RawDataRecord records = 1;

  // The database's last known ACK point for this collector.
  // This is critical for the new collector to initialize its cursor
  // and prevent an immediate DESYNC loop.
  uint64 database_confirms_last_acked_received_nanos = 2;
}

// ============== Common & QueryData RPC Messages ==============

message RawDataRecord {
  uint64 sent_nanos = 1;
  uint64 rtt_nanos = 2;
}

// Sent from GUI -> Database
message QueryRequest {
    // For now, this is empty. We can add time ranges, targets, etc., later.
}

// Sent from Database -> GUI
message QueryResponse {
    repeated RawDataRecord records = 1;
}

// --- Message Definitions for AnnouncePings ---
message AnnouncePingsRequest {
  // A list of absolute, monotonic UNIX timestamps (in nanos) for pings that were just sent.
  repeated uint64 sent_nanos = 1;
}

message AnnouncePingsResponse {
  // This is currently empty and serves as an acknowledgment.
}

// --- Message Definitions for SubscribeToCommands ---
message CommandRequest {
  // The UUID of the collector subscribing to commands.
  // This allows the database to associate the stream with a collector.
  string collector_uuid = 1;
}

message Command {
  // A unique, monotonically increasing ID for this command.
  uint64 command_id = 1;

  oneof command_type {
    // A command to change the collector's operational role.
    CollectorRole change_role = 2;
    // A command to prepare for a handoff.
    PrepareToSwap prepare_to_swap = 3;
  }
}

// A command to instruct the collector to prepare for a handoff at a specific time.
message PrepareToSwap {
  // The role the collector should adopt at the swap time.
  CollectorRole role = 1;
  // The UTC nanosecond timestamp at which the swap should occur.
  uint64 swap_at_nanos = 2;
}
